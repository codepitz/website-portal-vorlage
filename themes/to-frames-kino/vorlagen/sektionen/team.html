<section class="{{{klasseHtml}}} tf-sektion"{{{ankerAttrHtml}}}>
  <div class="ws-rahmen">
    {{> kopf}}
    <div class="tf-team">
      {{#team}}
      <article class="tf-person">
        {{#bildUrl}}<img src="{{bildUrl}}" alt="{{bildAlt}}" loading="lazy" decoding="async">{{/bildUrl}}
        {{^bildUrl}}<span class="tf-initialen" aria-hidden="true">{{initialen}}</span>{{/bildUrl}}
        <h3>{{name}}</h3>
        {{#rolle}}<p class="tf-meta">{{rolle}}{{#seit}} · seit {{seit}}{{/seit}}</p>{{/rolle}}
        {{#schwerpunkt}}<p>{{schwerpunkt}}</p>{{/schwerpunkt}}
        {{#zitat}}<blockquote>„{{zitat}}“</blockquote>{{/zitat}}
      </article>
      {{/team}}
    </div>
  </div>
</section>
